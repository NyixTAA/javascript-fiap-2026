            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <link rel="stylesheet" href="style.css">
                <title>Document</title>
            </head>
            <body>
                <div class="principal">
                    <h1>Lista Encadeada (versão simples)</h1>

                    <input type="text" id="nome" placeholder="Digite um nome" autocomplete="off">
                    <div class="content">
                    <button onclick="adicionarFim()">Adicionar no fim</button>
                    <button onclick="adicionarInicio()">Adicionar no início</button>
                    <button onclick="removerInicio()">Remover início</button>
                    <button onclick="contar()">Contar elementos</button>
                    <button onclick="apagar()">Apagar nome</button>
                    <button onclick="mostrar()">Mostrar lista</button>
                    </div>

                    
                    <div id="saida"></div>
                    <script>
                    // "lista encadeada" simulada
                    let valores = [];
                    let proximo = [];

                    let inicio = -1;
                    let ultimo = -1;

                    function adicionarFim() {
                        let nome = document.getElementById("nome").value;

                        if (nome === "") {
                            alert("Digite um nome");
                            return;
                        }

                        let novoIndice = valores.length;
                        valores.push(nome);
                        proximo.push(-1);

                        if (inicio === -1){
                            inicio = novoIndice;
                            ultimo = novoIndice;
                        } else {
                            proximo[ultimo] = novoIndice;
                            ultimo = novoIndice;
                        }

                        document.getElementById("nome").value = "";
                        mostrar();
                    }
                    function adicionarInicio() {
                        let nome = document.getElementById("nome").value;

                        if (nome === "") {
                            alert("Digite um nome");
                            return;
                        }

                        let novoIndice = valores.length;
                        valores.push(nome);
                        proximo.push(inicio);
                        inicio = novoIndice;

                        if (ultimo === -1) {
                            ultimo = novoIndice;
                        }
                        document.getElementById("nome").value = ""
                        mostrar();
                    }

                    function removerInicio() {
                        if (inicio === -1) {
                            alert("lista vazia");
                            return;
                        }

                        inicio = proximo[inicio];

                        if (inicio === -1) {
                            ultimo = -1;
                        }
                        mostrar();
                    }

                    function contar() {
                        let quantidade = 0;
                        let atual = inicio;
                        while (atual !== -1) {
                            quantidade++;
                            atual = proximo[atual];
                        }
                        document.getElementById("saida").innerHTML = "Quantidade de elementos: "
                        + quantidade;
                    }

                    function mostrar() {
                        let resultado = "";
                        let atual = inicio;

                        if (inicio === -1) {
                            resultado = "Lista vazia";
                        }

                        while (atual !== -1) {
                            resultado += valores[atual] + " → ";
                            atual = proximo[atual];
                        }

                        document.getElementById("saida").innerHTML = resultado;
                    }

                    function apagar() {
                        let nomeParaApagar = document.getElementById("nome").value;

                        if (nomeParaApagar === "") {
                            alert("Digite um nome para apagar");
                            return;
                        }

                        if (inicio === -1) {
                            alert("A lista está vazia!");
                            return;
                        }

                        if (valores[inicio] === nomeParaApagar) {
                            inicio = proximo[inicio]; // O início pula para o próximo
                            if (inicio === -1) {
                                ultimo = -1; // Se a lista ficou vazia, ajusta o último também
                            }
                            document.getElementById("nome").value = "";
                            mostrar();
                            return;
                        }

                        let atual = inicio;
                        let anterior = -1;

                        while (atual !== -1 && valores[atual] !== nomeParaApagar) {
                            anterior = atual;
                            atual = proximo[atual];
                        }

                        if (atual === -1) {
                            alert("Nome não encontrado na lista!");
                            return;
                        }

                        proximo[anterior] = proximo[atual];

                        if (atual === ultimo) {
                            ultimo = anterior;
                        }

                        document.getElementById("nome").value = "";
                        mostrar();
                    }
                </script>
                </div>
            </body>
            </html>
